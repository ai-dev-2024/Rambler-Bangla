name: Rambler production APK smoke test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "HTTPS URL for the production APK (short-lived host URLs OK; host must be allowlisted)"
        required: true
        type: string
  # Optional: invoke from another workflow and pass a URL from its outputs.
  workflow_call:
    inputs:
      apk_url:
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: com.aidev2024.ramblerbangla
  EXPECTED_SHA256: 6976d6a4483d3e98ad94c5e86e73dff8f608d55012d010d444184a1fc084588b
  APK_PATH: ${{ github.workspace }}/rambler-production.apk

jobs:
  smoke:
    # The APK is arm64-v8a-only. macos-14 (Apple Silicon) cannot boot the AVD:
    # its hosted runners cannot initialize HVF ("HVF error: HV_UNSUPPORTED").
    # API 35 google_apis x86_64 system images ship Google's built-in NDK/ARM
    # translation, so the arm64-only APK installs and runs on a KVM-accelerated
    # x86_64 emulator on ubuntu-latest (same approach ReactiveCircus
    # android-emulator-runner issue #458 documents as working).
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate APK host and download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_URL"
          if [[ "$APK_URL" != https://* ]]; then
            echo "APK URL must use https" >&2
            exit 1
          fi
          host="${APK_URL#https://}"
          host="${host%%/*}"
          host="$(printf '%s' "$host" | tr 'A-Z' 'a-z')"
          case "$host" in
            litter.catbox.moe|catbox.moe|gofile.io|store*.gofile.io)
              echo "APK host allowlisted: $host"
              ;;
            *)
              echo "APK host not allowlisted: $host" >&2
              exit 1
              ;;
          esac
          # Only the host is ever logged; the full URL stays out of the logs.
          if ! curl -sS --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 30 --max-time 300 \
              --output "$APK_PATH" "$APK_URL" 2>download.err; then
            echo "Download failed from host: $host" >&2
            exit 1
          fi
          echo "$EXPECTED_SHA256  $APK_PATH" | sha256sum --check --strict
          ls -lh "$APK_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and inspect APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            # android-emulator-runner runs each LINE as a separate `/bin/sh -c`
            # command (dash on ubuntu): no line continuations, no multi-line if
            # blocks, and no shell variables persisting across lines. Keep every
            # command self-contained on one line; intermediate values live in
            # smoke-artifacts files.
            mkdir -p smoke-artifacts
            adb wait-for-device
            adb shell getprop > smoke-artifacts/device-properties.txt
            grep -E "ro.product.cpu.abilist|ro.build.version.sdk" smoke-artifacts/device-properties.txt | tee smoke-artifacts/abi-report.txt || true
            adb logcat -c
            adb install --no-streaming -r -t "$APK_PATH" | tee smoke-artifacts/install.txt
            grep -F -q "Success" smoke-artifacts/install.txt
            adb shell pm path "$PACKAGE_NAME" | tee smoke-artifacts/package-path.txt
            grep -F -q "$PACKAGE_NAME" smoke-artifacts/package-path.txt
            adb shell dumpsys package "$PACKAGE_NAME" > smoke-artifacts/package-dump.txt
            # Launch via monkey: no activity class name needed; exits non-zero if no launchable activity exists.
            adb shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1 | tee smoke-artifacts/launch.txt
            grep -F -q "Events injected: 1" smoke-artifacts/launch.txt
            sleep 8
            # The app process must be alive after launch.
            adb shell pidof "$PACKAGE_NAME" | tee smoke-artifacts/pid-after-launch.txt
            test -s smoke-artifacts/pid-after-launch.txt
            adb shell dumpsys window windows > smoke-artifacts/windows-after-launch.txt
            adb shell dumpsys activity activities > smoke-artifacts/activities-after-launch.txt
            adb exec-out screencap -p > smoke-artifacts/after-launch.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml smoke-artifacts/window.xml || true
            adb logcat -d -v threadtime > smoke-artifacts/logcat.txt
            # Fail only on a fatal crash/ANR tied to this package: FATAL EXCEPTION prints "Process: <package>" on the following line, so match the pair.
            if grep -A1 "FATAL EXCEPTION" smoke-artifacts/logcat.txt | grep -q "Process: $PACKAGE_NAME"; then echo "Fatal exception for $PACKAGE_NAME found in logcat" >&2; exit 1; fi
            if grep -q "ANR in $PACKAGE_NAME" smoke-artifacts/logcat.txt; then echo "ANR for $PACKAGE_NAME found in logcat" >&2; exit 1; fi
            # IME smoke check: Android must register the input-method service and accept enable/select in this disposable AVD. Not proof of OEM Settings UX or dictation.
            adb shell ime list -a > smoke-artifacts/ime-list-before.txt
            adb shell ime list -s | tr -d '\r' | grep -m1 "^${PACKAGE_NAME}/" > smoke-artifacts/ime-id.txt || true
            if [ ! -s smoke-artifacts/ime-id.txt ]; then echo "No registered IME service found for $PACKAGE_NAME" >&2; exit 1; fi
            adb shell ime enable "$(cat smoke-artifacts/ime-id.txt)" | tee smoke-artifacts/ime-enable.txt
            adb shell ime set "$(cat smoke-artifacts/ime-id.txt)" | tee smoke-artifacts/ime-set.txt
            adb shell settings get secure default_input_method | tee smoke-artifacts/default-input-method.txt
            grep -F -q "$(cat smoke-artifacts/ime-id.txt)" smoke-artifacts/default-input-method.txt
            adb shell ime list -s > smoke-artifacts/ime-list-after.txt
            grep -F -q "$(cat smoke-artifacts/ime-id.txt)" smoke-artifacts/ime-list-after.txt
            echo "Registered and enabled IME: $(cat smoke-artifacts/ime-id.txt)" | tee smoke-artifacts/ime-result.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rambler-apk-smoke-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
