name: Rambler marked/unmarked clipboard preview probe
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'HTTPS APK URL on litter.catbox.moe'
        required: true
        type: string
      expected_sha256:
        description: 'Expected SHA-256 of exact APK'
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: com.aidev2024.ramblerbangla
      APK_PATH: ${{ github.workspace }}/under-test.apk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - name: Fetch exact pinned APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APK_URL" =~ ^https://litter\.catbox\.moe/[A-Za-z0-9_-]+\.apk$ ]] || { echo 'Unexpected APK host/path' >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid hash' >&2; exit 1; }
          curl -sS --fail --location --retry 2 --connect-timeout 20 --max-time 300 -o "$APK_PATH" "$APK_URL"
          echo "$EXPECTED_SHA256  $APK_PATH" | sha256sum --check --strict
      - name: Build local synthetic source app
        run: bash tests/clipboard-mask/build-fixture.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe clipboard previews
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p clipmask-artifacts && adb wait-for-device && adb install --no-streaming -r -t "$APK_PATH" > clipmask-artifacts/install.txt && grep -Fq Success clipmask-artifacts/install.txt && adb install --no-streaming -r -t tests/clipboard-mask/out/fixture.apk > clipmask-artifacts/fixture-install.txt && grep -Fq Success clipmask-artifacts/fixture-install.txt && python3 tests/clipboard-mask/clipmask_probe.py
      - name: Upload synthetic probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rambler-mask-probe-${{ github.run_id }}
          path: clipmask-artifacts/
          if-no-files-found: warn
          retention-days: 7
