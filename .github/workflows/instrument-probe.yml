name: Temporary Rambler instrumented settings probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned diagnostic APK
        run: |
          curl -fsSL --max-time 300 https://litter.catbox.moe/sv7o9f.apk -o /tmp/diagnostic.apk
          echo '92adef7d8dc3313950dee17bceba1b9bba43e12e79cfd9d15255cb5332c8a257  /tmp/diagnostic.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe settings and tap logs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p clipmask-artifacts
            adb wait-for-device
            adb install --no-streaming -r -t /tmp/diagnostic.apk
            python3 tests/clipboard-mask/instrument_probe.py
      - name: Upload tap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumented-tap-${{ github.run_id }}
          path: clipmask-artifacts/
          if-no-files-found: warn
          retention-days: 3
