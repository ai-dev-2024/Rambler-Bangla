name: Rambler clipboard pinned-reorder e2e

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "HTTPS URL for the APK under test (host must be on the list below)"
        required: true
        type: string
      expected_sha256:
        description: "SHA-256 of the APK at apk_url; download fails closed on mismatch"
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: com.aidev2024.ramblerbangla
  EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
  APK_PATH: ${{ github.workspace }}/rambler-production.apk

jobs:
  clipboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out test driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate APK host and download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_URL"
          if [[ "$APK_URL" != https://* ]]; then
            echo "APK URL must use https" >&2
            exit 1
          fi
          host="${APK_URL#https://}"
          host="${host%%/*}"
          host="$(printf '%s' "$host" | tr 'A-Z' 'a-z')"
          case "$host" in
            litter.catbox.moe|catbox.moe|gofile.io|store*.gofile.io|tmpfiles.org)
              echo "APK host allowlisted: $host"
              ;;
            *)
              echo "APK host not allowlisted: $host" >&2
              exit 1
              ;;
          esac
          # tmpfiles.org page URLs do not serve the file directly; the page
          # embeds a fresh /dl/ token link. Scrape it and download from this
          # same runner so any token/IP binding is satisfied.
          if [[ "$host" == "tmpfiles.org" ]]; then
            dl="$(curl -sS --fail --location --connect-timeout 30 --max-time 60 "$APK_URL" \
              | grep -oE 'https://tmpfiles\.org/dl/[^"]+' | head -n 1)"
            if [[ -z "$dl" ]]; then
              echo "No /dl/ link found on tmpfiles page" >&2
              exit 1
            fi
            APK_URL="$dl"
          fi
          # Only the host is ever logged; the full URL stays out of the logs.
          if ! curl -sS --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 30 --max-time 300 \
              --output "$APK_PATH" "$APK_URL" 2>download.err; then
            echo "Download failed from host: $host" >&2
            exit 1
          fi
          echo "$EXPECTED_SHA256  $APK_PATH" | sha256sum --check --strict
          ls -lh "$APK_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clipboard hold-then-move e2e
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p clip-artifacts
            adb wait-for-device
            adb install --no-streaming -r -t "$APK_PATH" | tee clip-artifacts/install.txt
            grep -F -q "Success" clip-artifacts/install.txt
            python3 scripts/clip_e2e.py

      - name: Upload clipboard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rambler-clipboard-e2e-${{ github.run_id }}
          path: clip-artifacts/
          if-no-files-found: warn
          retention-days: 14
