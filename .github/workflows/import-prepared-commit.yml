name: Import prepared Rambler Bangla source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified source commit
        env:
          PACK_B64: 
        run: |
          printf '%s' "$PACK_B64" | base64 -d > /tmp/source.pack
          git index-pack /tmp/source.pack
          git checkout 5ba5de675b29589a889d21ff04b6fba393099a90 -- .
          rm -rf .github/workflows
          git config user.name ai-dev-2024
          git config user.email ai-dev-2024@users.noreply.github.com
          git add -A
          git commit -m "feat: add guarded Rambler Bangla patch"
          git push origin HEAD:main
